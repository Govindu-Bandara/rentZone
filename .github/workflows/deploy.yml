name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build
        working-directory: rentzone-frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_ENABLE_WEBSOCKET: ${{ secrets.VITE_ENABLE_WEBSOCKET }}
          VITE_APP_ENV: ${{ secrets.VITE_APP_ENV }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_ENABLE_NOTIFICATIONS: "true"
          VITE_ENABLE_RECOMMENDATIONS: "true"
          VITE_ACCESS_TOKEN_EXPIRY: "3600"
          VITE_REFRESH_TOKEN_EXPIRY: "604800"
          VITE_DEFAULT_PAGE_SIZE: "12"
          VITE_MAX_FILE_SIZE: "5242880"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Setup server and install Nginx
        run: |
          ssh -i ~/.ssh/deploy_key.pem ubuntu@${{ secrets.EC2_HOST }} 'sudo apt update -y && sudo apt install nginx -y && sudo mkdir -p /var/www/html && sudo chown -R ubuntu:ubuntu /var/www/html'

      - name: Configure Nginx
        run: |
          ssh -i ~/.ssh/deploy_key.pem ubuntu@${{ secrets.EC2_HOST }} 'printf "server {\n    listen 80;\n    server_name _;\n    root /var/www/html;\n    index index.html;\n    location / {\n        try_files \$uri \$uri/ /index.html;\n    }\n}\n" | sudo tee /etc/nginx/sites-available/default && sudo nginx -t && sudo systemctl enable nginx && sudo systemctl restart nginx'

      - name: Upload build to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem -r rentzone-frontend/dist/* ubuntu@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Restart Nginx
        run: |
          ssh -i ~/.ssh/deploy_key.pem ubuntu@${{ secrets.EC2_HOST }} "sudo systemctl reload nginx"